<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><rect width="1200" height="700" rx="24" fill="#edf3f9"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><rect x="32" y="30" width="1136" height="640" rx="16" fill="#fff" stroke="#d6e1ec"/><circle cx="57" cy="53" r="5" fill="#d7e1eb"/><circle cx="77" cy="53" r="5" fill="#d7e1eb"/><circle cx="97" cy="53" r="5" fill="#d7e1eb"/><text x="132" y="59" fill="#60748a" font-size="16">本机训练室 · 功能示意</text><text x="63" y="115" fill="#17304e" font-size="27" font-weight="700">路演、答辩，按你的节奏练。</text><rect x="63" y="146" width="694" height="310" rx="14" fill="#112842"/><text x="93" y="190" fill="#7bd9c3" font-size="16">YOUR SLIDES</text><text x="93" y="276" fill="#fff" font-size="33">你的 PPT 完整逐页图片</text><text x="93" y="322" fill="#b5c8d9" font-size="21">记录每页用时，让反馈对应到页面</text><line x1="93" x2="720" y1="406" y2="406" stroke="#40627e" stroke-width="4"/><line x1="93" x2="386" y1="406" y2="406" stroke="#7bd9c3" stroke-width="4"/><rect x="787" y="146" width="349" height="142" rx="14" fill="#f0f6fb"/><text x="810" y="187" fill="#516c86" font-size="18">完整路演</text><text x="810" y="240" fill="#17304e" font-size="38" font-weight="700">10:00</text><text x="962" y="239" fill="#516c86" font-size="17">9 分钟提醒</text><rect x="787" y="308" width="349" height="148" rx="14" fill="#f0f6fb"/><text x="810" y="351" fill="#17304e" font-size="22" font-weight="600">可选：路演后接答辩</text><text x="810" y="389" fill="#516c86" font-size="18">校对 → 确认 → 独立计时</text><text x="810" y="424" fill="#516c86" font-size="18">也可选择不计时专项</text><rect x="63" y="485" width="343" height="132" rx="12" fill="#f8fafc" stroke="#d9e3ec"/><text x="85" y="531" fill="#17304e" font-size="23" font-weight="600">校对转写</text><text x="85" y="574" fill="#516c86" font-size="18">专业词提示 · 保留原文</text><rect x="428" y="485" width="343" height="132" rx="12" fill="#f8fafc" stroke="#d9e3ec"/><text x="450" y="531" fill="#17304e" font-size="23" font-weight="600">观察动作</text><text x="450" y="574" fill="#516c86" font-size="18">站姿 / 坐姿 · 事件可复核</text><rect x="793" y="485" width="343" height="132" rx="12" fill="#f8fafc" stroke="#d9e3ec"/><text x="815" y="531" fill="#17304e" font-size="23" font-weight="600">下一轮</text><text x="815" y="574" fill="#516c86" font-size="18">三项动作 · 练法与验收</text><text x="63" y="647" fill="#8192a6" font-size="14">示意图，不是实际训练截图。AI 在当前聊天中负责追问与点评；摄像头和麦克风可选。</text></g></svg>