<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1931"/><stop offset="1" stop-color="#163f53"/></linearGradient></defs><rect width="1200" height="560" rx="28" fill="url(#bg)"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="64" y="76" fill="#70e3c3" font-size="18" letter-spacing="3">PITCH DEFENSE COACH / AGENT SKILL</text><text x="64" y="151" fill="#fff" font-size="49" font-weight="700">把项目讲清楚，把证据讲到位。</text><text x="64" y="200" fill="#bfd0de" font-size="23">国创赛 · 挑战杯  /  用自己的材料，练自己的答辩</text><rect x="64" y="260" width="252" height="174" rx="18" fill="#ffffff" fill-opacity=".07" stroke="#61788c" stroke-opacity=".5"/><text x="86" y="303" fill="#70e3c3" font-size="18">01</text><text x="86" y="350" fill="#fff" font-size="30" font-weight="600">材料</text><text x="86" y="394" fill="#bfd0de" font-size="16">PPT · 讲稿 · 原题库</text><rect x="340" y="260" width="252" height="174" rx="18" fill="#ffffff" fill-opacity=".07" stroke="#61788c" stroke-opacity=".5"/><text x="362" y="303" fill="#70e3c3" font-size="18">02</text><text x="362" y="350" fill="#fff" font-size="30" font-weight="600">追问</text><text x="362" y="394" fill="#bfd0de" font-size="16">一次一题，沿证据下钻</text><rect x="616" y="260" width="252" height="174" rx="18" fill="#ffffff" fill-opacity=".07" stroke="#61788c" stroke-opacity=".5"/><text x="638" y="303" fill="#70e3c3" font-size="18">03</text><text x="638" y="350" fill="#fff" font-size="30" font-weight="600">复盘</text><text x="638" y="394" fill="#bfd0de" font-size="16">绑定题号、页码与时间</text><rect x="892" y="260" width="252" height="174" rx="18" fill="#ffffff" fill-opacity=".07" stroke="#61788c" stroke-opacity=".5"/><text x="914" y="303" fill="#70e3c3" font-size="18">04</text><text x="914" y="350" fill="#fff" font-size="30" font-weight="600">复训</text><text x="914" y="394" fill="#bfd0de" font-size="16">只改三个可执行动作</text><text x="64" y="503" fill="#8ca9bd" font-size="18">独立计时  /  可选串联  /  不计时专项  /  本机语音与动作观察</text></g></svg>